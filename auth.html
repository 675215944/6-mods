<!DOCTYPE html>
<html lang="sw">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#080808">
    <link rel="manifest" href="/manifest.json">
    <title>Ingia au Jisajili | 6+MODS</title>

    <link rel="stylesheet" href="style.css">

    <style>
        * {
            box-sizing: border-box;
        }

        :root {
            --gold: #e8c66a;
            --gold-light: #ffe9a6;
            --gold-dark: #9e7928;
            --black: #080808;
            --glass: rgba(255, 255, 255, 0.045);
            --border: rgba(232, 198, 106, 0.22);
            --muted: #aaa69b;
        }

        html {
            min-height: 100%;
            background: var(--black);
        }

        body {
            margin: 0;
            min-height: 100vh;
            min-height: 100dvh;
            color: #fff;
            font-family: -apple-system, BlinkMacSystemFont,
                "SF Pro Display", "Segoe UI", Arial, sans-serif;

            background:
                radial-gradient(
                    ellipse at 50% 0%,
                    rgba(171, 127, 39, 0.18),
                    transparent 48%
                ),
                radial-gradient(
                    ellipse at 0% 100%,
                    rgba(140, 100, 30, 0.09),
                    transparent 45%
                ),
                #080808;

            -webkit-font-smoothing: antialiased;
            overflow-x: hidden;
        }

        button,
        input {
            font: inherit;
        }

        /* PREMIUM HEADER */

        .top-bar {
            width: 100%;
            min-height: 78px;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 18px 20px;

            background: rgba(12, 12, 12, 0.72);
            border-bottom: 1px solid rgba(232, 198, 106, 0.15);

            backdrop-filter: blur(28px) saturate(150%);
            -webkit-backdrop-filter: blur(28px) saturate(150%);
        }

        .logo {
            font-size: 28px;
            font-weight: 950;
            letter-spacing: 2px;

            color: var(--gold-light);

            background: linear-gradient(
                135deg,
                #fff1bd 0%,
                #e8c66a 40%,
                #a87d28 75%,
                #ffe9a6 100%
            );

            -webkit-background-clip: text;
            background-clip: text;
            -webkit-text-fill-color: transparent;

            filter: drop-shadow(0 0 16px rgba(232, 198, 106, 0.13));
        }

        /* MAIN GLASS CARD */

        .auth-box {
            position: relative;
            isolation: isolate;

            width: calc(100% - 32px);
            max-width: 430px;

            margin: 45px auto 25px;
            padding: 32px 24px 28px;

            background: linear-gradient(
                145deg,
                rgba(255, 255, 255, 0.075),
                rgba(255, 255, 255, 0.018) 45%,
                rgba(232, 198, 106, 0.035)
            );

            border: 1px solid var(--border);
            border-radius: 30px;

            box-shadow:
                0 24px 70px rgba(0, 0, 0, 0.52),
                inset 0 1px 0 rgba(255, 255, 255, 0.09),
                0 0 40px rgba(201, 157, 55, 0.035);

            backdrop-filter: blur(35px) saturate(150%);
            -webkit-backdrop-filter: blur(35px) saturate(150%);

            overflow: hidden;
        }

        .auth-box::before {
            content: "";
            position: absolute;
            top: 0;
            left: 15%;
            width: 70%;
            height: 1px;

            background: linear-gradient(
                90deg,
                transparent,
                rgba(255, 233, 166, 0.8),
                transparent
            );

            pointer-events: none;
        }

        .auth-box::after {
            content: "";
            position: absolute;
            top: -90px;
            right: -100px;

            width: 190px;
            height: 190px;
            border-radius: 50%;

            background: rgba(232, 198, 106, 0.055);
            filter: blur(45px);

            z-index: -1;
            pointer-events: none;
        }

        /* GOLD BRAND ICON */

        .auth-icon {
            position: relative;

            width: 76px;
            height: 76px;

            display: flex;
            align-items: center;
            justify-content: center;

            margin: 0 auto 24px;

            border-radius: 24px;

            background: linear-gradient(
                145deg,
                rgba(255, 233, 166, 0.19),
                rgba(158, 121, 40, 0.08)
            );

            border: 1px solid rgba(255, 233, 166, 0.38);

            box-shadow:
                inset 0 1px 0 rgba(255, 255, 255, 0.13),
                0 10px 35px rgba(201, 157, 55, 0.09);

            color: var(--gold-light);
            font-size: 32px;
            font-weight: 950;
            letter-spacing: -2px;
        }

        h1 {
            margin: 0 0 12px;
            text-align: center;

            font-size: clamp(25px, 6vw, 30px);
            font-weight: 800;
            letter-spacing: -0.8px;
        }

        .description {
            margin: 0 0 30px;

            color: var(--muted);
            text-align: center;

            font-size: 14px;
            line-height: 1.75;
        }

        /* FORM FIELDS */

        .field {
            margin-bottom: 19px;
        }

        .field label {
            display: block;
            margin-bottom: 9px;

            color: #e9e2d1;
            font-size: 13px;
            font-weight: 650;
            letter-spacing: 0.2px;
        }

        .field input {
            display: block;
            width: 100%;
            min-height: 54px;
            padding: 15px 16px;

            color: #fff;
            font-size: 15px;

            background: rgba(0, 0, 0, 0.32);

            border: 1px solid rgba(255, 255, 255, 0.105);
            border-radius: 15px;

            outline: none;

            transition:
                border-color 0.25s ease,
                box-shadow 0.25s ease,
                background 0.25s ease;
        }

        .field input::placeholder {
            color: #77746d;
        }

        .field input:focus {
            background: rgba(0, 0, 0, 0.52);
            border-color: rgba(232, 198, 106, 0.75);

            box-shadow:
                0 0 0 4px rgba(232, 198, 106, 0.075),
                0 0 22px rgba(232, 198, 106, 0.045);
        }

        /* PREMIUM GOLD BUTTON */

        .primary-btn {
            position: relative;
            width: 100%;
            min-height: 55px;
            margin-top: 8px;
            padding: 15px 18px;

            border: 1px solid rgba(255, 233, 166, 0.65);
            border-radius: 16px;

            background: linear-gradient(
                135deg,
                #ffe9a6 0%,
                #e8c66a 38%,
                #c49a3d 72%,
                #e8c66a 100%
            );

            color: #171108;

            font-size: 16px;
            font-weight: 850;
            letter-spacing: 0.2px;

            cursor: pointer;

            box-shadow:
                0 8px 25px rgba(201, 157, 55, 0.17),
                inset 0 1px 0 rgba(255, 255, 255, 0.5);

            transition:
                transform 0.2s ease,
                box-shadow 0.2s ease,
                filter 0.2s ease;
        }

        .primary-btn:active:not(:disabled) {
            transform: scale(0.98);
            box-shadow: 0 3px 12px rgba(201, 157, 55, 0.15);
        }

        .primary-btn:hover:not(:disabled) {
            filter: brightness(1.07);

            box-shadow:
                0 10px 32px rgba(201, 157, 55, 0.25),
                inset 0 1px 0 rgba(255, 255, 255, 0.55);
        }

        .primary-btn:disabled {
            opacity: 0.58;
            cursor: not-allowed;
            filter: grayscale(0.25);
        }

        /* SWITCH LOGIN / REGISTER */

        .switch-box {
            margin-top: 27px;
            padding-top: 23px;

            text-align: center;

            border-top: 1px solid rgba(255, 255, 255, 0.09);
        }

        .switch-box p {
            margin: 0 0 8px;

            color: var(--muted);
            font-size: 13px;
        }

        .switch-btn {
            min-height: 42px;
            padding: 10px 15px;

            border: 1px solid rgba(232, 198, 106, 0.24);
            border-radius: 13px;

            background: rgba(232, 198, 106, 0.045);

            color: var(--gold-light);
            font-size: 14px;
            font-weight: 750;

            cursor: pointer;

            transition:
                background 0.2s ease,
                border-color 0.2s ease;
        }

        .switch-btn:hover {
            background: rgba(232, 198, 106, 0.10);
            border-color: rgba(232, 198, 106, 0.48);
        }

        /* STATUS MESSAGE */

        #message {
            margin-top: 18px;
            padding: 13px 14px;

            border-radius: 13px;

            font-size: 13px;
            line-height: 1.6;
            text-align: center;

            overflow-wrap: anywhere;
        }

        #message:empty {
            display: none;
        }

        .success {
            background: rgba(24, 125, 77, 0.15);
            color: #8cf0b9;
            border: 1px solid rgba(71, 202, 131, 0.32);
        }

        .error {
            background: rgba(160, 35, 55, 0.14);
            color: #ffacb6;
            border: 1px solid rgba(255, 95, 120, 0.3);
        }

        .info {
            background: rgba(232, 198, 106, 0.075);
            color: var(--gold-light);
            border: 1px solid rgba(232, 198, 106, 0.2);
        }

        .footer {
            margin: 28px 15px 35px;
            padding-bottom: 15px;

            color: #77736a;
            font-size: 11px;
            letter-spacing: 0.5px;

            text-align: center;
        }

        [hidden] {
            display: none !important;
        }

        /* APP INSTALL BUTTON */

        #install6mods {
            display: none;

            position: fixed;
            left: 50%;
            bottom: max(22px, env(safe-area-inset-bottom));

            transform: translateX(-50%);
            z-index: 9999;

            min-height: 50px;
            padding: 13px 23px;

            border: 1px solid rgba(255, 233, 166, 0.7);
            border-radius: 30px;

            background: linear-gradient(
                135deg,
                #ffe9a6,
                #d5ad4e,
                #b8860b
            );

            color: #100d06;

            font-size: 13px;
            font-weight: 900;
            letter-spacing: 0.5px;

            box-shadow:
                0 8px 30px rgba(232, 198, 106, 0.22),
                inset 0 1px 0 rgba(255, 255, 255, 0.5);

            cursor: pointer;
            white-space: nowrap;

            transition: filter 0.2s ease;
        }

        #install6mods:active {
            transform: translateX(-50%) scale(0.96);
        }

        @media (max-width: 480px) {
            .top-bar {
                min-height: 70px;
            }

            .auth-box {
                margin-top: 30px;
                padding: 29px 20px 25px;
                border-radius: 26px;
            }

            .auth-icon {
                width: 68px;
                height: 68px;
                border-radius: 21px;
            }
        }

        @media (prefers-reduced-motion: reduce) {
            *,
            *::before,
            *::after {
                transition-duration: 0.01ms !important;
            }
        }
    </style>
</head>

        <div class="logo">6+MODS</div>
    </header>

    <main class="auth-box">

        <div class="auth-icon">6+</div>

        <h1 id="formTitle">Karibu Tena!</h1>

        <p class="description" id="formDescription">
            Ingia kwenye akaunti yako ya 6+MODS.
        </p>

        <form id="authForm">

                <label for="name">Jina lako</label>

                <input

    </main>

    <footer class="footer">
        © 2026 6+MODS · ALL RIGHTS RESERVED
    </footer>

    <!-- LOGIN / REGISTER INTERFACE -->

    <script>
        let isRegistering = false;
        let firebaseReady = false;
        let firebaseError = "";

        const authForm = document.getElementById("authForm");
        const nameField = document.getElementById("nameField");
        const nameInput = document.getElementById("name");
        const emailInput = document.getElementById("email");
        const passwordInput = document.getElementById("password");
        const submitBtn = document.getElementById("submitBtn");
        const toggleBtn = document.getElementById("toggleBtn");
        const message = document.getElementById("message");

        function showMessage(text, type = "info") {
            message.textContent = text;
            message.className = type;
        }

        function setMode(register) {
            isRegistering = register;

            nameField.hidden = !register;
            nameInput.required = register;

            passwordInput.autocomplete = register
                ? "new-password"
                : "current-password";

            document.getElementById("formTitle").textContent =
                register ? "Tengeneza Akaunti" : "Karibu Tena!";

            document.getElementById("formDescription").textContent =
                register
                    ? "Jisajili ili uanze kutumia 6+MODS."
                    : "Ingia kwenye akaunti yako ya 6+MODS.";

            document.getElementById("switchText").textContent =
                register
                    ? "Tayari una akaunti?"
                    : "Bado huna akaunti?";

            toggleBtn.textContent =
                register ? "Ingia Sasa" : "Jisajili Sasa";

            if (firebaseReady) {
                submitBtn.textContent =
                    register ? "Jisajili" : "Ingia";

                showMessage("");
            } else {
                submitBtn.textContent =
                    "Inaunganisha Firebase...";

                if (firebaseError) {
                    showMessage(
                        "Firebase haijapakiwa: " + firebaseError,
                        "error"
                    );
                }
            }
        }

        toggleBtn.addEventListener("click", function () {
            setMode(!isRegistering);
        });

        const params = new URLSearchParams(
            window.location.search
        );

        if (params.get("mode") === "register") {
            setMode(true);
        }

        window.addEventListener("error", function (event) {
            if (!firebaseReady) {
                firebaseError =
                    event.message || "JavaScript error";

                showMessage(
                    "Hitilafu: " + firebaseError,
                    "error"
                );
            }
        });

        window.addEventListener(
            "unhandledrejection",
            function (event) {
                if (!firebaseReady) {
                    firebaseError =
                        event.reason?.message || "Module error";

                    showMessage(
                        "Hitilafu: " + firebaseError,
                        "error"
                    );
                }
            }
        );

        setTimeout(function () {
            if (!firebaseReady && !firebaseError) {
                showMessage(
                    "Firebase haijapakiwa. Hakikisha firebase.js ipo kwenye folder moja na auth.html, una intaneti, na unatumia Hosting au localhost badala ya file://.",
                    "error"
                );
            }
        }, 8000);

        authForm.addEventListener("submit", function (event) {
            event.preventDefault();
        });
    </script>

    <!-- FIREBASE AUTHENTICATION -->

    <script type="module">

        try {

            const firebaseAuthModule = await import(
                "https://www.gstatic.com/firebasejs/12.5.0/firebase-auth.js"
            );

            const firebaseLocalModule = await import(
                "./firebase.js"
            );

            const {
                createUserWithEmailAndPassword,
                signInWithEmailAndPassword,
                updateProfile
            } = firebaseAuthModule;

            const { auth } = firebaseLocalModule;

            if (!auth) {
                throw new Error(
                    "firebase.js haijatoa auth. Hakikisha kuna export const auth = getAuth(app);"
                );
            }

            firebaseReady = true;

            submitBtn.disabled = false;

            submitBtn.textContent = isRegistering
                ? "Jisajili"
                : "Ingia";

            showMessage("");

            console.log(
                "6+MODS Firebase Authentication imepakiwa."
            );

            let busy = false;

            authForm.addEventListener(
                "submit",
                async function (event) {

                    event.preventDefault();

                    if (busy) return;

                    const email =
                        emailInput.value.trim();

                    const password =
                        passwordInput.value;

                    const name =
                        nameInput.value.trim();

                    if (isRegistering && !name) {
                        showMessage(
                            "Tafadhali andika jina lako.",
                            "error"
                        );
                        return;
                    }

                    busy = true;
                    submitBtn.disabled = true;

                    showMessage(
                        isRegistering
                            ? "Tunasajili akaunti yako..."
                            : "Tunaingia kwenye akaunti yako...",
                        "info"
                    );

                    try {

                        if (isRegistering) {

                            const result =
                                await createUserWithEmailAndPassword(
                                    auth,
                                    email,
                                    password
                                );

                            try {
                                await updateProfile(
                                    result.user,
                                    {
                                        displayName: name
                                    }
                                );
                            } catch (profileError) {
                                console.warn(
                                    "Jina halijahifadhiwa:",
                                    profileError
                                );
                            }

                            showMessage(
                                "Hongera! Akaunti yako imesajiliwa kikamilifu.",
                                "success"
                            );

                        } else {

                            await signInWithEmailAndPassword(
                                auth,
                                email,
                                password
                            );

                            showMessage(
                                "Umeingia kwenye akaunti yako kikamilifu!",
                                "success"
                            );

                        }

                        setTimeout(function () {
                            window.location.href =
                                "user.html";
                        }, 1500);

                    } catch (error) {

                        console.error(
                            "Firebase Error:",
                            error
                        );

                        const errors = {

                            "auth/email-already-in-use":
                                "Email hii tayari imesajiliwa. Tafadhali ingia.",

                            "auth/invalid-email":
                                "Email uliyoandika si sahihi.",

                            "auth/weak-password":
                                "Nenosiri ni dhaifu. Tumia nenosiri imara.",

                            "auth/invalid-credential":
                                "Email au nenosiri si sahihi.",

                            "auth/user-not-found":
                                "Akaunti haijapatikana.",

                            "auth/wrong-password":
                                "Nenosiri si sahihi.",

                            "auth/network-request-failed":
                                "Tatizo la intaneti. Hakikisha una mtandao.",

                            "auth/too-many-requests":
                                "Umejaribu mara nyingi. Subiri kidogo.",

                            "auth/operation-not-allowed":
                                "Washa Email/Password kwenye Firebase Authentication.",

                            "auth/unauthorized-domain":
                                "Domain hii haijaidhinishwa kwenye Firebase.",

                            "auth/invalid-api-key":
                                "Firebase API Key si sahihi."
                        };

                        showMessage(
                            errors[error.code] ||
                            error.message ||
                            "Imeshindikana. Jaribu tena.",
                            "error"
                        );

                    } finally {

                        busy = false;
                        submitBtn.disabled = false;

                    }

                }
            );

        } catch (error) {

            console.error(
                "Firebase initialization error:",
                error
            );

            firebaseError =
                error.message ||
                "Firebase module error";

            showMessage(
                "Firebase haijaunganishwa: " +
                firebaseError,
                "error"
            );

            submitBtn.disabled = true;
            submitBtn.textContent =
                "Firebase haijaunganishwa";

        }

    </script>

<script>
let deferredInstallPrompt = null;

const installButton = document.getElementById("install6mods");

window.addEventListener("beforeinstallprompt", (event) => {
    event.preventDefault();
    deferredInstallPrompt = event;
    installButton.style.display = "block";
});

installButton.addEventListener("click", async () => {
    if (!deferredInstallPrompt) return;

    const promptEvent = deferredInstallPrompt;
    deferredInstallPrompt = null;

    installButton.style.display = "none";

    await promptEvent.prompt();
    await promptEvent.userChoice;
});

window.addEventListener("appinstalled", () => {
    deferredInstallPrompt = null;
    installButton.style.display = "none";
});
</script>
</body>
</html>
