<!DOCTYPE html>
<html lang="sw">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <meta name="theme-color" content="#080808">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="6+MODS">

    <link rel="manifest" href="/manifest.json">
    <link rel="stylesheet" href="style.css">

    <title>Ingia au Jisajili | 6+MODS</title>

    <style>
        * {
            box-sizing: border-box;
        }

        :root {
            --gold: #e8c66a;
            --gold-light: #ffe9a6;
            --gold-dark: #9e7928;
            --black: #080808;
            --muted: #aaa69b;
            --border: rgba(232, 198, 106, 0.22);
            --glass: rgba(255, 255, 255, 0.045);
        }

        html {
            min-height: 100%;
            background: var(--black);
        }

        body {
            margin: 0;
            min-height: 100vh;
            min-height: 100dvh;
            overflow-x: hidden;

            color: #fff;

            font-family:
                -apple-system,
                BlinkMacSystemFont,
                "SF Pro Display",
                "Segoe UI",
                Arial,
                sans-serif;

            background:
                radial-gradient(
                    ellipse at 50% 0%,
                    rgba(171, 127, 39, 0.18),
                    transparent 48%
                ),
                radial-gradient(
                    ellipse at 0% 100%,
                    rgba(140, 100, 30, 0.09),
                    transparent 45%
                ),
                #080808;

            -webkit-font-smoothing: antialiased;
        }

        button,
        input {
            font: inherit;
        }

        button {
            -webkit-tap-highlight-color: transparent;
        }

        button:focus-visible,
        input:focus-visible {
            outline: 2px solid var(--gold-light);
            outline-offset: 3px;
        }

        [hidden] {
            display: none !important;
        }

        /* ==============================
           PREMIUM IOS-STYLE HEADER
        ============================== */

        .top-bar {
            position: relative;
            z-index: 10;

            width: 100%;
            min-height: 78px;

            display: flex;
            align-items: center;
            justify-content: center;

            padding:
                18px
                20px;

            background: rgba(12, 12, 12, 0.72);

            border-bottom:
                1px solid rgba(232, 198, 106, 0.15);

            backdrop-filter:
                blur(28px) saturate(150%);

            -webkit-backdrop-filter:
                blur(28px) saturate(150%);
        }

        .logo {
            font-size: 28px;
            font-weight: 950;
            letter-spacing: 2px;

            background: linear-gradient(
                135deg,
                #fff1bd 0%,
                #e8c66a 40%,
                #a87d28 75%,
                #ffe9a6 100%
            );

            -webkit-background-clip: text;
            background-clip: text;
            -webkit-text-fill-color: transparent;

            filter:
                drop-shadow(
                    0 0 16px rgba(232, 198, 106, 0.13)
                );
        }

        /* ==============================
           FLOATING PWA INSTALL BANNER
        ============================== */

        .install-banner {
            position: fixed;

            top: calc(
                90px + env(safe-area-inset-top, 0px)
            );

            left: 50%;

            width: calc(100% - 32px);
            max-width: 350px;

            padding: 16px;

            z-index: 9999;

            color: #fff;

            background:
                linear-gradient(
                    145deg,
                    rgba(42, 39, 29, 0.94),
                    rgba(13, 13, 13, 0.96)
                );

            border:
                1px solid rgba(255, 233, 166, 0.34);

            border-radius: 24px;

            box-shadow:
                0 20px 60px rgba(0, 0, 0, 0.65),
                0 0 30px rgba(232, 198, 106, 0.10),
                inset 0 1px 0 rgba(255, 255, 255, 0.15);

            backdrop-filter:
                blur(35px) saturate(170%);

            -webkit-backdrop-filter:
                blur(35px) saturate(170%);

            transform:
                translateX(-50%) translateY(-16px);

            opacity: 0;

            visibility: hidden;
            pointer-events: none;

            transition:
                transform 0.35s ease,
                opacity 0.35s ease,
                visibility 0.35s ease;
        }

        .install-banner.show {
            transform:
                translateX(-50%) translateY(0);

            opacity: 1;
            visibility: visible;
            pointer-events: auto;
        }

        .install-banner::before {
            content: "";

            position: absolute;

            top: 0;
            left: 15%;

            width: 70%;
            height: 1px;

            background: linear-gradient(
                90deg,
                transparent,
                rgba(255, 233, 166, 0.8),
                transparent
            );

            pointer-events: none;
        }

        .install-header {
            display: flex;
            align-items: center;
            gap: 12px;

            padding-right: 25px;
        }

        .install-icon {
            width: 48px;
            height: 48px;

            flex-shrink: 0;

            display: flex;
            align-items: center;
            justify-content: center;

            border-radius: 15px;

            background: linear-gradient(
                145deg,
                #ffe9a6,
                #c49a3d
            );

            color: #171108;

            font-size: 20px;
            font-weight: 950;

            box-shadow:
                0 5px 20px rgba(232, 198, 106, 0.16);
        }

        .install-text {
            min-width: 0;
        }

        .install-text h3 {
            margin: 0 0 4px;

            font-size: 15px;
            font-weight: 800;

            color: #fff1bd;
        }

        .install-text p {
            margin: 0;

            color: #bbb5a6;

            font-size: 12px;
            line-height: 1.5;
        }

        .install-close {
            position: absolute;

            top: 12px;
            right: 12px;

            width: 30px;
            height: 30px;

            display: flex;
            align-items: center;
            justify-content: center;

            border: 1px solid rgba(255,255,255,0.08);
            border-radius: 50%;

            background: rgba(255,255,255,0.09);

            color: #ddd;

            font-size: 19px;
            font-weight: 400;

            cursor: pointer;

            transition:
                background 0.2s ease,
                transform 0.2s ease;
        }

        .install-close:hover {
            background: rgba(255,255,255,0.18);
        }

        .install-close:active {
            transform: scale(0.9);
        }

        .install-action {
            width: 100%;
            min-height: 44px;

            margin-top: 15px;
            padding: 11px 16px;

            border:
                1px solid rgba(255, 233, 166, 0.7);

            border-radius: 14px;

            background: linear-gradient(
                135deg,
                #ffe9a6,
                #e8c66a 45%,
                #c49a3d
            );

            color: #171108;

            font-size: 13px;
            font-weight: 900;
            letter-spacing: 0.4px;

            cursor: pointer;

            box-shadow:
                0 8px 25px rgba(232, 198, 106, 0.18),
                inset 0 1px 0 rgba(255,255,255,0.4);

            transition:
                transform 0.2s ease,
                filter 0.2s ease;
        }

        .install-action:hover {
            filter: brightness(1.07);
        }

        .install-action:active {
            transform: scale(0.98);
        }

        /* ==============================
           MAIN AUTH GLASS CARD
        ============================== */

        .auth-box {
            position: relative;
            isolation: isolate;

            width: calc(100% - 32px);
            max-width: 430px;

            margin: 45px auto 25px;
            padding: 32px 24px 28px;

            background: linear-gradient(
                145deg,
                rgba(255,255,255,0.075),
                rgba(255,255,255,0.018) 45%,
                rgba(232,198,106,0.035)
            );

            border: 1px solid var(--border);
            border-radius: 30px;

            box-shadow:
                0 24px 70px rgba(0,0,0,0.52),
                inset 0 1px 0 rgba(255,255,255,0.09),
                0 0 40px rgba(201,157,55,0.035);

            backdrop-filter:
                blur(35px) saturate(150%);

            -webkit-backdrop-filter:
                blur(35px) saturate(150%);

            overflow: hidden;
        }

        .auth-box::before {
            content: "";

            position: absolute;
            top: 0;
            left: 15%;

            width: 70%;
            height: 1px;

            background: linear-gradient(
                90deg,
                transparent,
                rgba(255,233,166,0.8),
                transparent
            );

            pointer-events: none;
        }

        .auth-box::after {
            content: "";

            position: absolute;
            top: -90px;
            right: -100px;

            width: 190px;
            height: 190px;

            border-radius: 50%;

            background:
                rgba(232,198,106,0.055);

            filter: blur(45px);

            z-index: -1;
            pointer-events: none;
        }

        /* ==============================
           GOLD BRAND ICON
        ============================== */

        .auth-icon {
            position: relative;

            width: 76px;
            height: 76px;

            display: flex;
            align-items: center;
            justify-content: center;

            margin: 0 auto 24px;

            border-radius: 24px;

            background: linear-gradient(
                145deg,
                rgba(255,233,166,0.19),
                rgba(158,121,40,0.08)
            );

            border:
                1px solid rgba(255,233,166,0.38);

            box-shadow:
                inset 0 1px 0 rgba(255,255,255,0.13),
                0 10px 35px rgba(201,157,55,0.09);

            color: var(--gold-light);

            font-size: 32px;
            font-weight: 950;
            letter-spacing: -2px;
        }

        h1 {
            margin: 0 0 12px;

            text-align: center;

            font-size:
                clamp(25px, 6vw, 30px);

            font-weight: 800;
            letter-spacing: -0.8px;
        }

        .description {
            margin: 0 0 30px;

            color: var(--muted);

            text-align: center;

            font-size: 14px;
            line-height: 1.75;
        }

        /* ==============================
           FORM FIELDS
        ============================== */

        .field {
            margin-bottom: 19px;
        }

        .field label {
            display: block;

            margin-bottom: 9px;

            color: #e9e2d1;

            font-size: 13px;
            font-weight: 650;
            letter-spacing: 0.2px;
        }

        .field input {
            display: block;

            width: 100%;
            min-height: 54px;

            padding: 15px 16px;

            color: #fff;
            font-size: 15px;

            background:
                rgba(0,0,0,0.32);

            border:
                1px solid rgba(255,255,255,0.105);

            border-radius: 15px;

            outline: none;

            transition:
                border-color 0.25s ease,
                box-shadow 0.25s ease,
                background 0.25s ease;
        }

        .field input::placeholder {
            color: #77746d;
        }

        .field input:focus {
            background: rgba(0,0,0,0.52);

            border-color:
                rgba(232,198,106,0.75);

            box-shadow:
                0 0 0 4px rgba(232,198,106,0.075),
                0 0 22px rgba(232,198,106,0.045);
        }

        /* ==============================
           PREMIUM GOLD BUTTON
        ============================== */

        .primary-btn {
            position: relative;

            width: 100%;
            min-height: 55px;

            margin-top: 8px;
            padding: 15px 18px;

            border:
                1px solid rgba(255,233,166,0.65);

            border-radius: 16px;

            background: linear-gradient(
                135deg,
                #ffe9a6 0%,
                #e8c66a 38%,
                #c49a3d 72%,
                #e8c66a 100%
            );

            color: #171108;

            font-size: 16px;
            font-weight: 850;
            letter-spacing: 0.2px;

            cursor: pointer;

            box-shadow:
                0 8px 25px rgba(201,157,55,0.17),
                inset 0 1px 0 rgba(255,255,255,0.5);

            transition:
                transform 0.2s ease,
                box-shadow 0.2s ease,
                filter 0.2s ease;
        }

        .primary-btn:hover:not(:disabled) {
            filter: brightness(1.07);

            box-shadow:
                0 10px 32px rgba(201,157,55,0.25),
                inset 0 1px 0 rgba(255,255,255,0.55);
        }

        .primary-btn:active:not(:disabled) {
            transform: scale(0.98);
        }

        .primary-btn:disabled {
            opacity: 0.58;
            cursor: not-allowed;
            filter: grayscale(0.25);
        }

        /* ==============================
           LOGIN / REGISTER SWITCH
        ============================== */

        .switch-box {
            margin-top: 27px;
            padding-top: 23px;

            text-align: center;

            border-top:
                1px solid rgba(255,255,255,0.09);
        }

        .switch-box p {
            margin: 0 0 8px;

            color: var(--muted);
            font-size: 13px;
        }

        .switch-btn {
            min-height: 42px;
            padding: 10px 15px;

            border:
                1px solid rgba(232,198,106,0.24);

            border-radius: 13px;

            background:
                rgba(232,198,106,0.045);

            color: var(--gold-light);

            font-size: 14px;
            font-weight: 750;

            cursor: pointer;

            transition:
                background 0.2s ease,
                border-color 0.2s ease;
        }

        .switch-btn:hover {
            background:
                rgba(232,198,106,0.10);

            border-color:
                rgba(232,198,106,0.48);
        }

        /* ==============================
           STATUS MESSAGES
        ============================== */

        #message {
            margin-top: 18px;
            padding: 13px 14px;

            border-radius: 13px;

            font-size: 13px;
            line-height: 1.6;
            text-align: center;

            overflow-wrap: anywhere;
        }

        #message:empty {
            display: none;
        }

        .success {
            background:
                rgba(24,125,77,0.15);

            color: #8cf0b9;

            border:
                1px solid rgba(71,202,131,0.32);
        }

        .error {
            background:
                rgba(160,35,55,0.14);

            color: #ffacb6;

            border:
                1px solid rgba(255,95,120,0.3);
        }

        .info {
            background:
                rgba(232,198,106,0.075);

            color: var(--gold-light);

            border:
                1px solid rgba(232,198,106,0.2);
        }

        /* ==============================
           FOOTER
        ============================== */

        .footer {
            margin: 28px 15px 35px;
            padding-bottom: 15px;

            color: #77736a;

            font-size: 11px;
            letter-spacing: 0.5px;

            text-align: center;
        }

        /* ==============================
           MOBILE RESPONSIVENESS
        ============================== */

        @media (max-width: 480px) {
            .top-bar {
                min-height: 70px;
            }

            .install-banner {
                top: calc(
                    82px + env(safe-area-inset-top, 0px)
                );
            }

            .auth-box {
                margin-top: 30px;
                padding: 29px 20px 25px;
                border-radius: 26px;
            }

            .auth-icon {
                width: 68px;
                height: 68px;
                border-radius: 21px;
            }
        }

        @media (prefers-reduced-motion: reduce) {
            *,
            *::before,
            *::after {
                transition-duration: 0.01ms !important;
                animation-duration: 0.01ms !important;
            }
        }
    </style>
</head>

<body>

    <!-- ==============================
         PREMIUM HEADER
    ============================== -->

    <header class="top-bar">
        <div class="logo">6+MODS</div>
    </header>

    <!-- ==============================
         FLOATING INSTALL BANNER
    ============================== -->

    <div
        id="installBanner"
        class="install-banner"
        role="region"
        aria-label="Sakinisha 6+MODS"
        aria-hidden="true"
    >

        <button
            type="button"
            id="closeInstall"
            class="install-close"
            aria-label="Funga tangazo la kusakinisha"
        >
            &times;
        </button>

        <div class="install-header">

            <div class="install-icon">
                6+
            </div>

            <div class="install-text">

                <h3>Install 6+MODS</h3>

                <p>
                    Sakinisha app yetu kwa matumizi
                    rahisi na ya haraka.
                </p>

            </div>

        </div>

        <button
            type="button"
            id="install6mods"
            class="install-action"
        >
            ↓ INSTALL APP
        </button>

    </div>

    <!-- ==============================
         LOGIN / REGISTER CARD
    ============================== -->

    <main class="auth-box">

        <div class="auth-icon">6+</div>

        <h1 id="formTitle">
            Karibu Tena!
        </h1>

        <p
            class="description"
            id="formDescription"
        >
            Ingia kwenye akaunti yako ya 6+MODS.
        </p>

        <form id="authForm">

            <div
                class="field"
                id="nameField"
                hidden
            >

                <label for="name">
                    Jina lako
                </label>

                <input
                    type="text"
                    id="name"
                    placeholder="Andika jina lako"
                    autocomplete="name"
                >

            </div>

            <div class="field">

                <label for="email">
                    Barua pepe
                </label>

                <input
                    type="email"
                    id="email"
                    placeholder="example@gmail.com"
                    autocomplete="email"
                    required
                >

            </div>

            <div class="field">

                <label for="password">
                    Nenosiri
                </label>

                <input
                    type="password"
                    id="password"
                    placeholder="Weka nenosiri"
                    autocomplete="current-password"
                    minlength="6"
                    required
                >

            </div>

            <button
                type="submit"
                class="primary-btn"
                id="submitBtn"
                disabled
            >
                Inaunganisha Firebase...
            </button>

        </form>

        <div
            id="message"
            role="status"
            aria-live="polite"
            class="info"
        >
            Inaunganisha Firebase...
        </div>

        <div class="switch-box">

            <p id="switchText">
                Bado huna akaunti?
            </p>

            <button
                type="button"
                class="switch-btn"
                id="toggleBtn"
            >
                Jisajili Sasa
            </button>

        </div>

    </main>

    <!-- FOOTER -->

    <footer class="footer">
        © 2026 6+MODS · ALL RIGHTS RESERVED
    </footer>

    <!-- ==============================
         LOGIN / REGISTER INTERFACE
    ============================== -->

    <script>
        let isRegistering = false;
        let firebaseReady = false;
        let firebaseError = "";

        const authForm =
            document.getElementById("authForm");

        const nameField =
            document.getElementById("nameField");

        const nameInput =
            document.getElementById("name");

        const emailInput =
            document.getElementById("email");

        const passwordInput =
            document.getElementById("password");

        const submitBtn =
            document.getElementById("submitBtn");

        const toggleBtn =
            document.getElementById("toggleBtn");

        const message =
            document.getElementById("message");

        function showMessage(text, type = "info") {
            message.textContent = text;
            message.className = type;
        }

        function setMode(register) {
            isRegistering = register;

            nameField.hidden = !register;
            nameInput.required = register;

            passwordInput.autocomplete = register
                ? "new-password"
                : "current-password";

            document.getElementById(
                "formTitle"
            ).textContent = register
                ? "Tengeneza Akaunti"
                : "Karibu Tena!";

            document.getElementById(
                "formDescription"
            ).textContent = register
                ? "Jisajili ili uanze kutumia 6+MODS."
                : "Ingia kwenye akaunti yako ya 6+MODS.";

            document.getElementById(
                "switchText"
            ).textContent = register
                ? "Tayari una akaunti?"
                : "Bado huna akaunti?";

            toggleBtn.textContent = register
                ? "Ingia Sasa"
                : "Jisajili Sasa";

            if (firebaseReady) {
                submitBtn.textContent = register
                    ? "Jisajili"
                    : "Ingia";

                showMessage("");
            } else {
                submitBtn.textContent =
                    "Inaunganisha Firebase...";

                if (firebaseError) {
                    showMessage(
                        "Firebase haijapakiwa: " +
                        firebaseError,
                        "error"
                    );
                }
            }
        }

        toggleBtn.addEventListener(
            "click",
            function () {
                setMode(!isRegistering);
            }
        );

        const params =
            new URLSearchParams(
                window.location.search
            );

        if (params.get("mode") === "register") {
            setMode(true);
        }

        window.addEventListener(
            "error",
            function (event) {
                if (!firebaseReady) {
                    firebaseError =
                        event.message ||
                        "JavaScript error";

                    showMessage(
                        "Hitilafu: " + firebaseError,
                        "error"
                    );
                }
            }
        );

        window.addEventListener(
            "unhandledrejection",
            function (event) {
                if (!firebaseReady) {
                    firebaseError =
                        event.reason?.message ||
                        "Module error";

                    showMessage(
                        "Hitilafu: " + firebaseError,
                        "error"
                    );
                }
            }
        );

        setTimeout(function () {
            if (!firebaseReady && !firebaseError) {
                showMessage(
                    "Firebase haijapakiwa. Hakikisha firebase.js ipo kwenye folder moja na auth.html, una intaneti, na unatumia Hosting au localhost badala ya file://.",
                    "error"
                );
            }
        }, 8000);

        authForm.addEventListener(
            "submit",
            function (event) {
                event.preventDefault();
            }
        );
    </script>

    <!-- ==============================
         FIREBASE AUTHENTICATION
    ============================== -->

    <script type="module">
        try {
            const firebaseAuthModule =
                await import(
                    "https://www.gstatic.com/firebasejs/12.5.0/firebase-auth.js"
                );

            const firebaseLocalModule =
                await import("./firebase.js");

            const {
                createUserWithEmailAndPassword,
                signInWithEmailAndPassword,
                updateProfile
            } = firebaseAuthModule;

            const { auth } = firebaseLocalModule;

            if (!auth) {
                throw new Error(
                    "firebase.js haijatoa auth. Hakikisha kuna export const auth = getAuth(app);"
                );
            }

            firebaseReady = true;
            submitBtn.disabled = false;

            submitBtn.textContent =
                isRegistering
                    ? "Jisajili"
                    : "Ingia";

            showMessage("");

            console.log(
                "6+MODS Firebase Authentication imepakiwa."
            );

            let busy = false;

            authForm.addEventListener(
                "submit",
                async function (event) {
                    event.preventDefault();

                    if (busy) return;

                    const email =
                        emailInput.value.trim();

                    const password =
                        passwordInput.value;

                    const name =
                        nameInput.value.trim();

                    if (isRegistering && !name) {
                        showMessage(
                            "Tafadhali andika jina lako.",
                            "error"
                        );
                        return;
                    }

                    busy = true;
                    submitBtn.disabled = true;

                    showMessage(
                        isRegistering
                            ? "Tunasajili akaunti yako..."
                            : "Tunaingia kwenye akaunti yako...",
                        "info"
                    );

                    try {
                        if (isRegistering) {
                            const result =
                                await createUserWithEmailAndPassword(
                                    auth,
                                    email,
                                    password
                                );

                            try {
                                await updateProfile(
                                    result.user,
                                    {
                                        displayName: name
                                    }
                                );
                            } catch (profileError) {
                                console.warn(
                                    "Jina halijahifadhiwa:",
                                    profileError
                                );
                            }

                            showMessage(
                                "Hongera! Akaunti yako imesajiliwa kikamilifu.",
                                "success"
                            );

                        } else {
                            await signInWithEmailAndPassword(
                                auth,
                                email,
                                password
                            );

                            showMessage(
                                "Umeingia kwenye akaunti yako kikamilifu!",
                                "success"
                            );
                        }

                        setTimeout(function () {
                            window.location.href =
                                "user.html";
                        }, 1500);

                    } catch (error) {
                        console.error(
                            "Firebase Error:",
                            error
                        );

                        const errors = {
                            "auth/email-already-in-use":
                                "Email hii tayari imesajiliwa. Tafadhali ingia.",

                            "auth/invalid-email":
                                "Email uliyoandika si sahihi.",

                            "auth/weak-password":
                                "Nenosiri ni dhaifu. Tumia nenosiri imara.",

                            "auth/invalid-credential":
                                "Email au nenosiri si sahihi.",

                            "auth/user-not-found":
                                "Akaunti haijapatikana.",

                            "auth/wrong-password":
                                "Nenosiri si sahihi.",

                            "auth/network-request-failed":
                                "Tatizo la intaneti. Hakikisha una mtandao.",

                            "auth/too-many-requests":
                                "Umejaribu mara nyingi. Subiri kidogo.",

                            "auth/operation-not-allowed":
                                "Washa Email/Password kwenye Firebase Authentication.",

                            "auth/unauthorized-domain":
                                "Domain hii haijaidhinishwa kwenye Firebase.",

                            "auth/invalid-api-key":
                                "Firebase API Key si sahihi."
                        };

                        showMessage(
                            errors[error.code] ||
                            error.message ||
                            "Imeshindikana. Jaribu tena.",
                            "error"
                        );

                    } finally {
                        busy = false;
                        submitBtn.disabled = false;
                    }
                }
            );

        } catch (error) {
            console.error(
                "Firebase initialization error:",
                error
            );

            firebaseError =
                error.message ||
                "Firebase module error";

            showMessage(
                "Firebase haijaunganishwa: " +
                firebaseError,
                "error"
            );

            submitBtn.disabled = true;
            submitBtn.textContent =
                "Firebase haijaunganishwa";
        }
    </script>

    <!-- ==============================
         SMART PWA INSTALLATION
    ============================== -->

    <script>
        let deferredInstallPrompt = null;

        const installBanner =
            document.getElementById("installBanner");

        const installButton =
            document.getElementById("install6mods");

        const closeInstall =
            document.getElementById("closeInstall");

        const installDismissKey =
            "6mods_install_dismissed";

        function isInstallDismissed() {
            try {
                return sessionStorage.getItem(
                    installDismissKey
                ) === "true";
            } catch (error) {
                return false;
            }
        }

        function dismissInstall() {
            try {
                sessionStorage.setItem(
                    installDismissKey,
                    "true"
                );
            } catch (error) {
                console.warn(
                    "Session storage unavailable:",
                    error
                );
            }

            hideInstallBanner();
        }

        function showInstallBanner() {
            if (isInstallDismissed()) return;

            installBanner.classList.add("show");

            installBanner.setAttribute(
                "aria-hidden",
                "false"
            );
        }

        function hideInstallBanner() {
            installBanner.classList.remove("show");

            installBanner.setAttribute(
                "aria-hidden",
                "true"
            );
        }

        function isAppInstalled() {
            return (
                window.matchMedia(
                    "(display-mode: standalone)"
                ).matches ||
                window.navigator.standalone === true
            );
        }

        window.addEventListener(
            "beforeinstallprompt",
            function (event) {
                event.preventDefault();

                deferredInstallPrompt = event;

                if (
                    !isAppInstalled() &&
                    !isInstallDismissed()
                ) {
                    showInstallBanner();
                }
            }
        );

        closeInstall.addEventListener(
            "click",
            function () {
                dismissInstall();
            }
        );

        installButton.addEventListener(
            "click",
            async function () {
                if (!deferredInstallPrompt) return;

                const promptEvent =
                    deferredInstallPrompt;

                deferredInstallPrompt = null;

                hideInstallBanner();

                try {
                    await promptEvent.prompt();

                    const choice =
                        await promptEvent.userChoice;

                    if (
                        choice.outcome === "dismissed"
                    ) {
                        dismissInstall();
                    }

                } catch (error) {
                    console.error(
                        "PWA installation error:",
                        error
                    );
                }
            }
        );

        window.addEventListener(
            "appinstalled",
            function () {
                deferredInstallPrompt = null;
                hideInstallBanner();
            }
        );

        if (isAppInstalled()) {
            hideInstallBanner();
        }
    </script>
